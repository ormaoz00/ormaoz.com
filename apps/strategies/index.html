<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מאגר האסטרטגיות | Or Maoz</title>
  <meta name="description" content="מאגר האסטרטגיות העסקיות והשיווקיות של אור מעוז - ניהול, קופירייטינג, קהלי יעד ומשפכים.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Marked.js Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>

  <div class="app-container">
    <!-- Sidebar (Right side for RTL) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <span class="logo-icon">⚡</span>
          <h1 class="logo-text">Or Maoz</h1>
        </div>
        <p class="logo-sub">Strategy Vault</p>
      </div>

      <nav class="nav-menu">
        <ul id="strategy-list">
          <!-- Dynamically populated -->
        </ul>
      </nav>

      <div class="sidebar-footer">
        <a href="https://github.com/ormaoz00/ormaoz.com" target="_blank" class="github-link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
          <span>מאגר הקוד ב-GitHub</span>
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="content-header">
        <div class="search-container">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="חיפוש באסטרטגיות..." autocomplete="off">
          <button id="clear-search" class="clear-btn" style="display: none;">&times;</button>
        </div>
      </header>

      <section class="content-viewport">
        <!-- Rendered markdown content card -->
        <article class="content-card glass-card">
          <div class="card-loader" id="loader">
            <div class="spinner"></div>
          </div>
          <div class="markdown-body" id="content-area">
            <!-- Content will be injected here -->
          </div>
        </article>
      </section>
    </main>
  </div>

  <!-- Data & Logic scripts -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
