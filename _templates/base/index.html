<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}} | Or Maoz</title>
    <meta name="description" content="{{PAGE_DESCRIPTION}}">
    <meta property="og:title" content="{{PAGE_TITLE}} | Or Maoz">
    <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://{{SUBDOMAIN}}.ormaoz.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container nav-content">
            <a href="https://ormaoz.com" class="logo">
                <span class="logo-mark">O</span>
                <span class="logo-text">Or Maoz</span>
            </a>
            <span class="nav-page-name">{{PAGE_NAME}}</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="content">
        <div class="container">
            <h1>{{PAGE_TITLE}}</h1>
            <p>התוכן שלך כאן</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Or Maoz. כל הזכויות שמורות.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
